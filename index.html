<!DOCTYPE html>
<html>
<head>
    <title>3D Модель Насоса</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #loading {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 100;
        }
        #modelMenu {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-family: sans-serif;
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            background: rgba(0,0,0,0.7);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка модели...</div>
    <select id="modelMenu">
        <option value="heat_station.gltf">Оборудование (heat_station)</option>
        <option value="heat_station_modul.gltf">Модуль (heat_station_modul)</option>
    </select>
    <canvas id="canvas" style="width: 100%; height: 100%; display: block;"></canvas>

    <!-- Подключаем библиотеки Babylon.js и загрузчик glTF -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);

        const BASE_URL = "https://mezenovperm.github.io/pumps_station/";
        
        // Функция создания сцены с указанной моделью
        function createScene(modelFile) {
            const scene = new BABYLON.Scene(engine);
/*
            // Камера и свет
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                -Math.PI / 2,
                Math.PI / 3,
                3,
                new BABYLON.Vector3(0, 0, 0),
                scene
            );
            camera.attachControl(canvas, true);

            const light = new BABYLON.HemisphericLight(
                "light",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            light.intensity = 0.7;

            // Показываем индикатор загрузки
            const loadingDiv = document.getElementById("loading");
            loadingDiv.style.display = 'block';
            loadingDiv.textContent = "Загрузка модели...";
*/
            // Загружаем модель
            BABYLON.SceneLoader.Append(BASE_URL, modelFile, scene, function () {
                loadingDiv.style.display = 'none';
                console.log("Модель успешно загружена: " + modelFile);
            });

            return scene;
        }

        // Текущая сцена
        let scene = createScene("heat_station.gltf");

        // Обработчик выбора модели в меню
        document.getElementById("modelMenu").addEventListener("change", function (e) {
            const newModel = e.target.value;
            // Удаляем старую сцену
            scene.dispose();
            // Создаём новую
            scene = createScene(newModel);
        });

        // Цикл рендеринга
        engine.runRenderLoop(function () {
            scene.render();
        });

        // Обработка изменения размера окна
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
